name: ClipAMV Android Emulator QA

on:
  workflow_dispatch:

jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app encoder matrix on Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p qa-emulator-results
            set +e
            gradle :app:connectedDebugAndroidTest --stacktrace
            code=$?
            adb pull /sdcard/Android/data/com.mikeschamoy.amvconverter/files/ClipAMV-emulator-matrix.csv qa-emulator-results/matrix.csv || true
            adb logcat -d -v time > qa-emulator-results/logcat.txt || true
            adb shell screencap -p /sdcard/clipamv_qa_screen.png || true
            adb pull /sdcard/clipamv_qa_screen.png qa-emulator-results/screenshot.png || true
            exit "$code"
      - name: Upload result CSV, Android logs and instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipAMV-Android-Emulator-QA
          if-no-files-found: warn
          path: |
            qa-emulator-results/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
