name: ClipAMV Final APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch and verify pinned FFmpegKit AAR
        run: bash scripts/fetch_arm32_engine.sh
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Reuse consistent ClipAMV debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: clipamv-universal-debug-keystore-v1
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle :app:assembleDebug -PclipamvArm32=true --stacktrace
      - name: Verify ARM32-only APK
        run: python3 scripts/verify_arm32_engine.py app/build/outputs/apk/debug/app-debug.apk
      - name: Name APK ClipAMV
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ClipAMV-v0.7.10-ARM32.apk
          (cd dist && sha256sum ClipAMV-v0.7.10-ARM32.apk > SHA256SUMS.txt)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipAMV-v0.7.10-ARM32
          path: dist/
          if-no-files-found: error
