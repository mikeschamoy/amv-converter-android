name: ClipAMV Final APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Name APK ClipAMV
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ClipAMV.apk
          (cd dist && sha256sum ClipAMV.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ClipAMV-Final-APK
          path: dist/
          if-no-files-found: error
